<VirtualHost *:80>
    DocumentRoot /home/web/evelexicon/htdocs
    ServerName evelexicon.com
    ErrorLog  "|/usr/local/sbin/cronolog /home/web/evelexicon/logs/%Y/%m/%d/error.log"
    # %a = visitor IP after mod_remoteip (combined's %h would log Cloudflare's IP)
    CustomLog  "|/usr/local/sbin/cronolog /home/web/evelexicon/logs/%Y/%m/%d/combined.log" "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\""

    # The site sits behind Cloudflare: take the visitor IP from CF-Connecting-IP, but only when the
    # request really comes from a Cloudflare range (https://www.cloudflare.com/ips/, fetched 2026-11-11).
    <IfModule remoteip_module>
        RemoteIPHeader CF-Connecting-IP
        RemoteIPTrustedProxy 173.245.48.0/20
        RemoteIPTrustedProxy 103.21.244.0/22
        RemoteIPTrustedProxy 103.22.200.0/22
        RemoteIPTrustedProxy 103.31.4.0/22
        RemoteIPTrustedProxy 141.101.64.0/18
        RemoteIPTrustedProxy 108.162.192.0/18
        RemoteIPTrustedProxy 190.93.240.0/20
        RemoteIPTrustedProxy 188.114.96.0/20
        RemoteIPTrustedProxy 197.234.240.0/22
        RemoteIPTrustedProxy 198.41.128.0/17
        RemoteIPTrustedProxy 162.158.0.0/15
        RemoteIPTrustedProxy 104.16.0.0/13
        RemoteIPTrustedProxy 104.24.0.0/14
        RemoteIPTrustedProxy 172.64.0.0/13
        RemoteIPTrustedProxy 131.0.72.0/22
        RemoteIPTrustedProxy 2400:cb00::/32
        RemoteIPTrustedProxy 2606:4700::/32
        RemoteIPTrustedProxy 2803:f800::/32
        RemoteIPTrustedProxy 2405:b500::/32
        RemoteIPTrustedProxy 2405:8100::/32
        RemoteIPTrustedProxy 2a06:98c0::/29
        RemoteIPTrustedProxy 2c0f:f248::/32
    </IfModule>

<directory /home/web/evelexicon/htdocs/>
order deny,allow
allow from all
Require all granted
    AllowOverride All

</directory>

# Content Security Policy: scripts/styles only from this site and Google's jQuery CDN, no inline code.
# Portraits come from images.evetech.net; jQuery UI theme images from ajax.googleapis.com.
# The sha256 hash allows only the literal inline handler "t" that jQuery 1.11's feature detection sets.
<IfModule headers_module>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://ajax.googleapis.com 'unsafe-hashes' 'sha256-47mKTaMaEn1L3m5DAz9muidMqw636xxw7EFAK/YnPdg='; style-src 'self' https://ajax.googleapis.com; img-src 'self' https://images.evetech.net https://ajax.googleapis.com data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
</IfModule>

DirectoryIndex index.php
rewriteEngine On
RewriteRule ^/term/(.*) /bounce.php?search=$1 [PT,B]


ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9001/home/web/evelexicon/htdocs/$1

</VirtualHost>


<VirtualHost *:80>
    DocumentRoot /home/web/evelexicon/htdocs
   ServerName www.evelexicon.com
   redirect permanent / http://evelexicon.com/
</VirtualHost>


